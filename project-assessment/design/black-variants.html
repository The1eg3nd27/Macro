&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {

        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

  function review() {
    return `&lt;section class=&quot;kt-surface kt-review&quot;&gt;&lt;div&gt;&lt;span class=&quot;kt-caption&quot;&gt;Team Brain · ${model.approved?&#x27;Updated&#x27;:model.dismissed?&#x27;No pending updates&#x27;:&#x27;1 pending update&#x27;}&lt;/span&gt;&lt;h2&gt;${model.approved?&#x27;Writing guidance approved&#x27;:model.dismissed?&#x27;Suggestion dismissed&#x27;:&#x27;Writing guidance&#x27;}&lt;/h2&gt;&lt;p&gt;${model.approved?&#x27;Revision 2 saved with its original source.&#x27;:model.dismissed?&#x27;The original conversation is unchanged.&#x27;:&#x27;Add “use clear, direct language” to the company guidelines.&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;kt-review-actions&quot;&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-page=&quot;Team Brain&quot;&gt;${model.approved?&#x27;View update&#x27;:model.dismissed?&#x27;View knowledge&#x27;:&#x27;Review change&#x27;}&lt;/button&gt;&lt;span class=&quot;kt-note&quot;&gt;Next review · 16 Nov&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;`;

  function today(direction) {

    const conversations = `&lt;section class=&quot;kt-recent&quot;&gt;&lt;div class=&quot;kt-section-head&quot;&gt;&lt;h2&gt;Conversations&lt;/h2&gt;&lt;span class=&quot;kt-count&quot;&gt;Team&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kt-conversation&quot;&gt;&lt;div&gt;&lt;strong&gt;Campaign&lt;/strong&gt;&lt;p&gt;Proposal due Friday, 6 November.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;kt-text-button cursor-interaction&quot; data-page=&quot;Chat&quot;&gt;Open&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;kt-conversation&quot;&gt;&lt;div&gt;&lt;strong&gt;Company writing&lt;/strong&gt;&lt;p&gt;${model.approved?&#x27;Writing guidance approved.&#x27;:model.dismissed?&#x27;Writing suggestion dismissed.&#x27;:&#x27;New guidance awaiting review.&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;kt-text-button cursor-interaction&quot; data-page=&quot;Team Brain&quot;&gt;Review&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`;
    if (direction === &#x27;studio&#x27;) {
      return `&lt;div class=&quot;kt-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;kt-caption&quot;&gt;Monday · 2 November 2026&lt;/p&gt;&lt;h1&gt;Today&lt;/h1&gt;&lt;/div&gt;&lt;span class=&quot;kt-overview-state&quot;&gt;Team workspace&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kt-studio-grid&quot;&gt;&lt;div class=&quot;kt-studio-work&quot;&gt;${taskSection}${conversations}${review()}&lt;/div&gt;&lt;aside class=&quot;kt-inspector&quot; aria-label=&quot;Day agenda&quot;&gt;${calendar()}&lt;div class=&quot;kt-next-review&quot;&gt;&lt;span class=&quot;kt-caption&quot;&gt;Team Brain&lt;/span&gt;&lt;p&gt;Next review&lt;/p&gt;&lt;strong&gt;Monday, 16 November&lt;/strong&gt;&lt;button class=&quot;kt-text-button cursor-interaction&quot; data-page=&quot;Team Brain&quot;&gt;Open knowledge →&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;`;
    }

  }
  function taskPage() {
    const visible = allTasks().filter(t=&gt;t.title.toLowerCase().includes(model.query.toLowerCase()));
    return `&lt;div class=&quot;kt-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;kt-caption&quot;&gt;Team workspace&lt;/p&gt;&lt;h1&gt;Tasks&lt;/h1&gt;&lt;p class=&quot;kt-subtitle&quot;&gt;All team tasks&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-page=&quot;Chat&quot;&gt;Review chat suggestion&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;kt-subnav&quot; aria-label=&quot;Task layout&quot;&gt;${[&#x27;List&#x27;,&#x27;Board&#x27;].map(v=&gt;`&lt;button class=&quot;cursor-interaction&quot; data-layout=&quot;${v}&quot; aria-pressed=&quot;${model.layout===v}&quot;&gt;${v}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${model.layout===&#x27;List&#x27;?`&lt;section class=&quot;kt-surface&quot;&gt;&lt;div class=&quot;kt-section-head&quot;&gt;&lt;h2&gt;Team tasks&lt;/h2&gt;&lt;span class=&quot;kt-count&quot;&gt;${model.complete.length} completed&lt;/span&gt;&lt;/div&gt;${taskRows(visible)}&lt;/section&gt;`:`&lt;div class=&quot;kt-board&quot;&gt;${[[&#x27;To do&#x27;,visible.filter(t=&gt;!model.complete.includes(t.id)&amp;&amp;t.id!==&#x27;outline&#x27;)],[&#x27;In progress&#x27;,visible.filter(t=&gt;!model.complete.includes(t.id)&amp;&amp;t.id===&#x27;outline&#x27;)],[&#x27;Done&#x27;,visible.filter(t=&gt;model.complete.includes(t.id))]].map(([name,list])=&gt;`&lt;section class=&quot;kt-surface&quot;&gt;&lt;h2&gt;${name}&lt;/h2&gt;${list.length?taskRows(list):&#x27;&lt;p class=&quot;kt-note&quot; style=&quot;margin-top:16px&quot;&gt;No tasks here&lt;/p&gt;&#x27;}&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}`;
  }
  function chat() {
    return `&lt;div class=&quot;kt-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;kt-caption&quot;&gt;Team conversation&lt;/p&gt;&lt;h1&gt;Campaign&lt;/h1&gt;&lt;p class=&quot;kt-subtitle&quot;&gt;Messages · Attachments · 3 participants&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;kt-surface&quot;&gt;&lt;div class=&quot;kt-thread&quot;&gt;&lt;div class=&quot;kt-message&quot;&gt;&lt;span class=&quot;kt-avatar&quot;&gt;A&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Teammate A&lt;/strong&gt;&lt;small&gt;09:14&lt;/small&gt;&lt;p&gt;I&#x27;ll finish the campaign proposal by Friday, 6 November.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kt-message&quot;&gt;&lt;span class=&quot;kt-avatar&quot;&gt;Y&lt;/span&gt;&lt;div&gt;&lt;strong&gt;You&lt;/strong&gt;&lt;small&gt;09:16&lt;/small&gt;&lt;p&gt;For our writing, let&#x27;s use clear, direct language and avoid unnecessary jargon.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kt-proposal&quot;&gt;&lt;span class=&quot;kt-caption&quot;&gt;${model.created?&#x27;Task created&#x27;:&#x27;Suggested task&#x27;}&lt;/span&gt;&lt;p&gt;Finish the campaign proposal&lt;/p&gt;&lt;div class=&quot;kt-task-meta&quot;&gt;&lt;span&gt;Owner: Teammate A&lt;/span&gt;&lt;span&gt;Due: Fri, 6 Nov 2026&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kt-actions&quot;&gt;&lt;button class=&quot;kt-button kt-primary cursor-interaction&quot; ${model.created?&#x27;data-page=&quot;Tasks&quot;&#x27;:&#x27;data-action=&quot;create&quot;&#x27;}&gt;${model.created?&#x27;Open tasks&#x27;:&#x27;Confirm task&#x27;}&lt;/button&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;source&quot;&gt;View source&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;kt-note&quot;&gt;Nothing enters the task list until confirmed.&lt;/p&gt;&lt;/section&gt;`;
  }
  function brain() {
    return `&lt;div class=&quot;kt-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;kt-caption&quot;&gt;Shared, approved context&lt;/p&gt;&lt;h1&gt;Team Brain&lt;/h1&gt;&lt;p class=&quot;kt-subtitle&quot;&gt;Approved knowledge and proposed changes.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;kt-surface&quot;&gt;${!model.approved&amp;&amp;!model.dismissed?`&lt;div class=&quot;kt-section-head&quot;&gt;&lt;h2&gt;Writing guidance&lt;/h2&gt;&lt;span class=&quot;kt-count&quot;&gt;Pending your approval&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kt-knowledge&quot;&gt;&lt;p class=&quot;kt-caption&quot;&gt;Current&lt;/p&gt;&lt;p&gt;Keep communication professional and approachable.&lt;/p&gt;&lt;p class=&quot;kt-caption&quot; style=&quot;margin-top:16px&quot;&gt;Proposed addition&lt;/p&gt;&lt;p style=&quot;color:var(--kt-text)&quot;&gt;Use clear, direct language. Avoid unnecessary jargon.&lt;/p&gt;&lt;div class=&quot;kt-actions&quot;&gt;&lt;button class=&quot;kt-button kt-primary cursor-interaction&quot; data-action=&quot;approve&quot;&gt;Approve update&lt;/button&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;dismiss&quot;&gt;Dismiss&lt;/button&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;source&quot;&gt;View source&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`:`&lt;div class=&quot;kt-section-head&quot;&gt;&lt;h2&gt;Writing guidance&lt;/h2&gt;&lt;span class=&quot;kt-count&quot;&gt;${model.approved?&#x27;Approved · revision 2&#x27;:&#x27;Revision 1 · unchanged&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kt-knowledge&quot;&gt;&lt;p&gt;Keep communication professional and approachable.&lt;/p&gt;${model.approved?&#x27;&lt;p style=&quot;color:var(--kt-text)&quot;&gt;Use clear, direct language. Avoid unnecessary jargon.&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;source&quot;&gt;View source&lt;/button&gt;&lt;/div&gt;`}&lt;div class=&quot;kt-knowledge&quot;&gt;&lt;h3&gt;Company profile&lt;/h3&gt;&lt;p&gt;Our purpose, work, and shared standards.&lt;/p&gt;&lt;span class=&quot;kt-note&quot;&gt;Sample record · approved context&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;kt-knowledge&quot;&gt;&lt;h3&gt;Fortnightly review&lt;/h3&gt;&lt;p&gt;Next review: Monday, 16 November. Review stale guidance, conflicting decisions, and completed work.&lt;/p&gt;&lt;span class=&quot;kt-note&quot;&gt;Propose changes → owner approves → archive with history&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;`;
  }
  function files() {
    return `&lt;div class=&quot;kt-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;kt-caption&quot;&gt;Shared resources&lt;/p&gt;&lt;h1&gt;Files&lt;/h1&gt;&lt;p class=&quot;kt-subtitle&quot;&gt;Shared documents and assets.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;section class=&quot;kt-surface&quot;&gt;${[[&#x27;Campaign brief&#x27;,&#x27;Document · Campaign&#x27;],[&#x27;Brand guidelines&#x27;,&#x27;Document · Company&#x27;],[&#x27;Visual references&#x27;,&#x27;Folder · Workspace&#x27;]].map(([name,detail])=&gt;`&lt;div class=&quot;kt-listrow&quot;&gt;&lt;div&gt;&lt;h3&gt;${name}&lt;/h3&gt;&lt;p class=&quot;kt-note&quot;&gt;${detail}&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;kt-note&quot;&gt;Sample&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;`;
  }
  function render() {
    const focused = document.activeElement;
    const focusApp = focused?.closest(&#x27;.kt-app&#x27;);
    const focusKey = focusApp &amp;&amp; [&#x27;task&#x27;,&#x27;action&#x27;,&#x27;page&#x27;,&#x27;layout&#x27;].find(key =&gt; focused.dataset[key]);
    const focusValue = focusKey ? focused.dataset[focusKey] : null;
    apps.forEach(app =&gt; {
      app.innerHTML = `&lt;div class=&quot;kt-layout&quot;&gt;&lt;aside class=&quot;kt-sidebar&quot;&gt;${app.dataset.theme===&#x27;ledger&#x27;?`&lt;div class=&quot;kt-brand&quot;&gt;&lt;span class=&quot;kt-logo&quot;&gt;&lt;img src=&quot;${logoSource}&quot; alt=&quot;The KEY&quot;&gt;&lt;/span&gt;&lt;small&gt;TEAM&lt;/small&gt;&lt;/div&gt;`:``}&lt;nav class=&quot;kt-nav&quot; aria-label=&quot;Workspace&quot;&gt;${nav.map(([name,ic])=&gt;`&lt;button class=&quot;cursor-interaction&quot; data-page=&quot;${name}&quot; aria-label=&quot;${name}&quot; ${model.page===name?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${icon(ic)}&lt;span&gt;${name}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;&lt;p class=&quot;kt-caption kt-side-label&quot;&gt;Projects&lt;/p&gt;&lt;div class=&quot;kt-project&quot;&gt;&lt;span&gt;&lt;/span&gt;Campaign&lt;/div&gt;&lt;div class=&quot;kt-project&quot;&gt;&lt;span&gt;&lt;/span&gt;Workspace&lt;/div&gt;&lt;div class=&quot;kt-sidebar-footer&quot;&gt;&lt;span class=&quot;kt-caption&quot;&gt;Your team&lt;/span&gt;&lt;div class=&quot;kt-people&quot;&gt;&lt;span class=&quot;kt-avatar&quot; aria-label=&quot;You&quot;&gt;Y&lt;/span&gt;&lt;span class=&quot;kt-avatar&quot; aria-label=&quot;Teammate A&quot;&gt;A&lt;/span&gt;&lt;span class=&quot;kt-avatar&quot; aria-label=&quot;Teammate B&quot;&gt;B&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;kt-note&quot;&gt;3 members&lt;/p&gt;&lt;/div&gt;&lt;/aside&gt;&lt;div class=&quot;kt-main&quot;&gt;&lt;header class=&quot;kt-topbar&quot;&gt;${app.dataset.theme===&#x27;studio&#x27;?`&lt;div class=&quot;kt-brand&quot;&gt;&lt;span class=&quot;kt-logo&quot;&gt;&lt;img src=&quot;${logoSource}&quot; alt=&quot;The KEY&quot;&gt;&lt;/span&gt;&lt;small&gt;TEAM&lt;/small&gt;&lt;/div&gt;`:``}&lt;div class=&quot;kt-breadcrumb&quot;&gt;Workspace &lt;span&gt;/ ${model.page}&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;kt-search-button cursor-interaction&quot; data-action=&quot;search&quot;&gt;${icon(&#x27;search&#x27;)} Search tasks&lt;/button&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;ai&quot; aria-expanded=&quot;${model.ai}&quot;&gt;${icon(&#x27;panel-right&#x27;)} Assistant&lt;/button&gt;&lt;/header&gt;&lt;main class=&quot;kt-body&quot;&gt;${model.search?&#x27;&lt;label class=&quot;kt-note&quot;&gt;Find a task&lt;input class=&quot;kt-search-input&quot; type=&quot;search&quot; aria-label=&quot;Find a task&quot; placeholder=&quot;Search task titles&quot;&gt;&lt;/label&gt;&#x27;:&#x27;&#x27;}${model.page===&#x27;Today&#x27;?today(app.dataset.theme):model.page===&#x27;Tasks&#x27;?taskPage():model.page===&#x27;Chat&#x27;?chat():model.page===&#x27;Calendar&#x27;?`&lt;div class=&quot;kt-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;kt-caption&quot;&gt;Meetings &amp; deadlines&lt;/p&gt;&lt;h1&gt;Calendar&lt;/h1&gt;&lt;p class=&quot;kt-subtitle&quot;&gt;Meetings and task deadlines.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;${calendar(true)}`:model.page===&#x27;Team Brain&#x27;?brain():files()}${model.source?`&lt;aside class=&quot;kt-source&quot; aria-label=&quot;Original source&quot;&gt;&lt;div class=&quot;kt-section-head&quot;&gt;&lt;h3&gt;Source · Campaign conversation&lt;/h3&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;source&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;p&gt;Teammate A, 09:14: “I&#x27;ll finish the campaign proposal by Friday, 6 November.”&lt;/p&gt;&lt;p style=&quot;margin-top:12px&quot;&gt;You, 09:16: “For our writing, let&#x27;s use clear, direct language and avoid unnecessary jargon.”&lt;/p&gt;&lt;/aside&gt;`:&#x27;&#x27;}&lt;/main&gt;${model.ai?`&lt;aside class=&quot;kt-ai&quot; aria-label=&quot;AI context&quot;&gt;&lt;div class=&quot;kt-section-head&quot;&gt;&lt;h2&gt;Workspace assistant&lt;/h2&gt;&lt;button class=&quot;kt-button cursor-interaction&quot; data-action=&quot;ai&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&lt;label class=&quot;kt-note&quot;&gt;Model &lt;select aria-label=&quot;Model&quot;&gt;&lt;option&gt;Claude&lt;/option&gt;&lt;option&gt;GPT&lt;/option&gt;&lt;option&gt;Local model&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;p style=&quot;font-size:13px;margin-top:14px&quot;&gt;${allTasks().filter(t=&gt;!model.complete.includes(t.id)).length} tasks are open. ${model.approved?&#x27;The latest writing guidance is approved.&#x27;:model.dismissed?&#x27;There are no pending knowledge updates.&#x27;:&#x27;One writing-guidance update needs your approval.&#x27;}&lt;/p&gt;&lt;p class=&quot;kt-note&quot; style=&quot;margin-top:9px&quot;&gt;Preview response · no model connection&lt;/p&gt;&lt;/aside&gt;`:&#x27;&#x27;}&lt;footer class=&quot;kt-foot&quot;&gt;&lt;span&gt;The KEY Team · ${app.dataset.theme===&#x27;studio&#x27;?&#x27;Black Studio&#x27;:&#x27;Black Ledger&#x27;}&lt;/span&gt;&lt;span&gt;Interactive concept · sample data · resets on reload&lt;/span&gt;&lt;/footer&gt;&lt;/div&gt;&lt;/div&gt;`;
      if (model.search) app.querySelector(&#x27;.kt-search-input&#x27;).value = model.query;
    });
    if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:17,height:17}});
    if (focusApp &amp;&amp; focusKey) {
      const replacement = [...focusApp.querySelectorAll(`[data-${focusKey}]`)].find(el =&gt; el.dataset[focusKey] === focusValue);
      replacement?.focus({preventScroll:true});
    }
  }
  root.addEventListener(&#x27;click&#x27;, e =&gt; {
    const button = e.target.closest(&#x27;button&#x27;);
    if (!button || !root.contains(button)) return;
    if (button.dataset.page) { model.page = button.dataset.page; model.source = false; model.query=&#x27;&#x27;; model.search=false; }
    if (button.dataset.layout) model.layout=button.dataset.layout;
    const action = button.dataset.action;
    if (action===&#x27;create&#x27;) model.created=true;
    if (action===&#x27;approve&#x27;) model.approved=true;
    if (action===&#x27;dismiss&#x27;) model.dismissed=true;
    if (action===&#x27;source&#x27;) model.source=!model.source;
    if (action===&#x27;ai&#x27;) model.ai=!model.ai;
    if (action===&#x27;search&#x27;) { model.search=!model.search; model.page=&#x27;Tasks&#x27;; model.query=&#x27;&#x27;; }
    if (button.dataset.page || button.dataset.layout || action) render();
  });
  root.addEventListener(&#x27;change&#x27;, e =&gt; {
    const id=e.target.dataset.task;
    if (!id) return;
    model.complete=model.complete.includes(id)?model.complete.filter(x=&gt;x!==id):[...model.complete,id];
    render();
  });
  root.addEventListener(&#x27;input&#x27;, e =&gt; {
    if (!e.target.matches(&#x27;.kt-search-input&#x27;)) return;
    model.query=e.target.value;
    const app=e.target.closest(&#x27;.kt-app&#x27;);
    const start=e.target.selectionStart;
    render();
    const input=app.querySelector(&#x27;.kt-search-input&#x27;);
    input.focus();
    if (start!==null) input.setSelectionRange(start,start);
  });
  render();
  if (globalThis.Tweak) apps.forEach(app =&gt; {
    const state={radius:0,blur:22};
    const tweak=new Tweak({container:app,onChange:()=&gt;{app.style.setProperty(&#x27;--kt-radius&#x27;,`${state.radius}px`);app.style.setProperty(&#x27;--kt-blur&#x27;,`${state.blur}px`);}});
    tweak.addSlider(state,&#x27;radius&#x27;,{label:&#x27;Control radius&#x27;,min:0,max:6,unit:&#x27;px&#x27;});
    if (app.dataset.theme===&#x27;glass&#x27;) tweak.addSlider(state,&#x27;blur&#x27;,{label:&#x27;Sidebar glass&#x27;,min:0,max:36,unit:&#x27;px&#x27;});
  });
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
